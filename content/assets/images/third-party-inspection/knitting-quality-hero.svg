<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-label="Illustration of garment inspection with a checklist and magnifying glass">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2C66"/>
      <stop offset="100%" stop-color="#17408F"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E8EC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#bgGrad)"/>

  <!-- decorative dot grid -->
  <g fill="#4A90D9" opacity="0.18">
    <circle cx="120" cy="80" r="3"/><circle cx="160" cy="80" r="3"/><circle cx="200" cy="80" r="3"/>
    <circle cx="120" cy="120" r="3"/><circle cx="160" cy="120" r="3"/><circle cx="200" cy="120" r="3"/>
    <circle cx="1400" cy="380" r="3"/><circle cx="1440" cy="380" r="3"/><circle cx="1480" cy="380" r="3"/>
    <circle cx="1400" cy="420" r="3"/><circle cx="1440" cy="420" r="3"/><circle cx="1480" cy="420" r="3"/>
  </g>

  <!-- folded garment -->
  <g transform="translate(1120,120)">
    <path d="M40 0 L200 0 L230 40 L200 60 L200 260 L40 260 L40 60 L10 40 Z" fill="url(#shirtGrad)" stroke="#B9C2CE" stroke-width="2"/>
    <path d="M100 0 Q120 30 140 0" fill="none" stroke="#B9C2CE" stroke-width="3"/>
  </g>

  <!-- clipboard -->
  <g transform="translate(950,150)">
    <rect x="0" y="0" width="140" height="180" rx="10" fill="#FFFFFF"/>
    <rect x="40" y="-14" width="60" height="24" rx="6" fill="#2ECC71"/>
    <g stroke="#17408F" stroke-width="6" stroke-linecap="round">
      <line x1="20" y1="50" x2="120" y2="50"/>
      <line x1="20" y1="80" x2="120" y2="80"/>
      <line x1="20" y1="110" x2="90" y2="110"/>
    </g>
    <g fill="#2ECC71">
      <circle cx="20" cy="50" r="7"/>
      <circle cx="20" cy="80" r="7"/>
    </g>
  </g>

  <!-- magnifying glass -->
  <g transform="translate(760,190)">
    <circle cx="70" cy="70" r="65" fill="none" stroke="#4A90D9" stroke-width="14"/>
    <line x1="118" y1="118" x2="175" y2="175" stroke="#4A90D9" stroke-width="18" stroke-linecap="round"/>
    <circle cx="70" cy="70" r="45" fill="#0F2C66" opacity="0.35"/>
  </g>

  <!-- headline space kept clean intentionally; text is set in HTML, not baked into the image -->
</svg>
