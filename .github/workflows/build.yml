name: Build and Deploy ZIABRIDGE Site

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site with Eleventy
        run: npx @11ty/eleventy

      - name: Copy existing static pages into the build output
        # Everything that is NOT yet a CMS-managed Knowledge article (the
        # homepage, other service pages, the pages/ folder, etc.) is plain
        # static HTML and just needs to be copied through as-is, so nothing
        # about the rest of the site changes.
        run: |
          rsync -av --exclude 'content' --exclude '_site' --exclude 'node_modules' \
            --exclude '.eleventy.js' --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude '_includes' --exclude '.git' --exclude '.github' \
            ./ ./_site/

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
